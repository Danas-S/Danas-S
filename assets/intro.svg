<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 30" width="340" height="30" role="img" aria-label="Aspiring Software Engineer">
<title>Aspiring Software Engineer</title>
<style>.t{fill:#6939AC;stroke:#FFFFFF}@media (prefers-color-scheme: dark){.t{fill:#C28BFA;stroke:#0D1117}}</style>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="0.85" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="340" height="30"><rect x="-400" y="0" width="400" height="30" fill="url(#edge)"><animate attributeName="x" from="-400" to="0" begin="0s" dur="2.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.35 1"/></rect></mask>
</defs>
<text class="t" x="0" y="22" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.2" stroke-width="3" stroke-linejoin="round" paint-order="stroke" mask="url(#reveal)">Aspiring Software Engineer</text>
</svg>
